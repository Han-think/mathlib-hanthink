[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathlib-hanthink"
version = "0.1.0"
authors = [{ name = "Han-think" }]
description = "A class-based Python utility package for arithmetic, geometric sequences, and trigonometry"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Han-think/mathlib-hanthink"

[dependency-groups]
dev = ["pytest>=8.0", "twine>=6.1.0"]
